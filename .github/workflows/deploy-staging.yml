name: Deploy staging

# Keyless deploy of the Book API (Cloud Run) + Firebase Hosting to the staging
# environment. Triggers on the push to main DIRECTLY (D143). The authoritative
# gate is the pull-request run, which verifies the merge result before the merge
# is allowed (branch protection requires it `strict`, N91) — so a commit can only
# reach main already-green, and a post-merge re-run would add latency, not signal.
# This replaces the previous `workflow_run: ["CI"]` chain (amends N82).
#
# The paths-ignore carries N82's docs-only skip over from ci.yml's old push
# trigger: a merge touching only these paths deploys nothing. Scoped deliberately
# — packages/help-content ships Markdown into the app bundle (D111), as does
# apps/web/src/content, so a blanket `**/*.md` would silently stop shipping real
# content changes. Only paths whose contents can never enter a build artifact are
# listed.
#
# The Markdown entries come in `X/*.md` + `X/**/*.md` PAIRS. A single `*` does not
# cross `/`, so `X/*.md` is exactly the directory's own Markdown; `X/**/*.md` covers
# anything nested below it. The pair is deliberate belt-and-braces: GitHub documents
# `**` as matching multiple directories but does not state whether it matches ZERO,
# so one pattern alone might or might not cover `infra/README.md`. Two unambiguous
# patterns beat one whose semantics we would be guessing at.
#
# ⚠ The `infra/` entries must stay narrowed to Markdown — never blanket `infra/**`.
# The "Load staging environment" step below reads infra/environments/staging.env
# into $GITHUB_ENV; that is how BACKUP_INVOKER_SUBJECT and the rest reach the
# service, so a change to it MUST deploy (OFC-336).
#
# Auth is via Workload Identity Federation (infra/setup-wif.sh) — GitHub mints a
# short-lived OIDC token Google trusts only for this repo. There is no JSON key
# anywhere in the repo or its secrets, which is essential: this repo is PUBLIC.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"
      - "infra/*.md"
      - "infra/**/*.md"
      - "tools/*.md"
      - "tools/**/*.md"
      - "ghost-bridge/*.md"
      - "ghost-bridge/**/*.md"
  # Manual re-deploy (e.g. after a config change with no new commit, or to
  # redeploy a commit whose merge skipped the deploy under paths-ignore).
  workflow_dispatch:

# Never run two deploys at once; a deploy in flight should finish, not be cancelled.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    # No job-level guard: both triggers are deploy-worthy on their own. The push
    # trigger is already branch- and path-filtered above, and a workflow_dispatch
    # is a deliberate human act. (The old `if` existed to interrogate a
    # workflow_run payload for conclusion/branch/event — none of which exists,
    # or is needed, on a direct push. D143.)
    permissions:
      contents: read
      id-token: write # required for the WIF OIDC token exchange

    steps:
      # The default checkout is exactly right for both triggers: the pushed
      # commit on a push, the dispatched ref's tip on a manual run. The explicit
      # `ref` this replaces existed only because a workflow_run checkout defaults
      # to the branch tip, which may have moved past the commit CI validated —
      # a hazard the direct push trigger removes outright (D143).
      - name: Checkout
        uses: actions/checkout@v7

      # The build id stamped into both the SPA (BOOK_APP_VERSION → clientContext.webVersion)
      # and the API (BOOK_API_VERSION → the server-stamped apiVersion on bug reports).
      # Same commit for both, so a mismatch in a filed report flags a stale cached SPA (N61).
      - name: Resolve build version
        run: echo "BOOK_VERSION=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Load the environment's values from the single source of truth shared with
      # the provisioning scripts (infra/environments/staging.env, OFC-84) so this
      # workflow no longer hardcodes project/region/SA/bucket/Ghost values inline.
      # `tr -d '\r'` guards against CRLF; the grep skips comments and blank lines.
      # A prod deploy workflow points at environments/prod.env instead.
      - name: Load staging environment
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' infra/environments/staging.env | tr -d '\r' >> "$GITHUB_ENV"

      # Build the SPA FIRST — it needs no cloud auth, and doing the slow work
      # before authenticating keeps the gap between auth and the deploys short.
      # @pbe/shared must compile before the SPA build (vite resolves the
      # workspace package to its built dist/).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared libs + SPA
        env:
          BOOK_APP_VERSION: ${{ env.BOOK_VERSION }}
        run: |
          npm run build:libs
          npm run build:web

      # Authenticate LAST-minute: the auth action bakes GitHub's short-lived OIDC
      # token into the ADC credential file statically, so the deploys must run
      # soon after this step — not behind a multi-minute build.
      - name: Authenticate to Google Cloud (keyless, WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      # Run the Firebase CLI under Node 20: under Node 24 google-auth-library's STS
      # token exchange dies with "Premature close" (undici), so the WIF credential
      # never resolves. Node 20's HTTP stack handles it. The SPA was already built
      # on Node 24 above; firebase-tools has no native deps, so this is safe.
      # NB: the `@v7` action pin (the action's OWN Node-24 runtime, bumped with all
      # the others in OFC-62/N87) is orthogonal to `node-version: "20"` (the Node it
      # INSTALLS for the run steps below). Keep the 20 — it's the load-bearing pin.
      - name: Use Node 20 for the Firebase CLI
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Firebase reads the ADC file via google-auth-library (no FIREBASE_TOKEN, no
      # key). --project is explicit because .firebaserc's default is the emulator.
      # firestore:rules ships the deny-all backstop (firestore.rules) on every
      # deploy so the enforced policy always matches the repo (needs the deployer's
      # firebaserules.admin role — see infra/setup-wif.sh).
      - name: Deploy Firebase Hosting + Firestore rules
        run: npx firebase deploy --only hosting,firestore:rules --project "$PROJECT_ID" --non-interactive

      # Re-seed staging so its data is always a pure function of the deployed code
      # — the same clean-replace discipline as the seed scripts themselves, made
      # automatic so staging can never drift from the generator (the failure that
      # bit us when the fixture names changed but staging was never re-seeded).
      # Runs BEFORE the Cloud Run deploy so the new revision cold-starts and
      # hydrates the freshly-seeded data. It runs on the Node-20 step above, where
      # google-auth-library's STS exchange works (the Node-24 undici bug that the
      # Firebase pin dodges).
      #
      # It no longer links a tester: that moved to the "Provision UAT testers" step
      # below, which needs `gcloud secrets` and so cannot live here (OFC-248).
      #
      # TOGGLE: set the repository variable STAGING_AUTOSEED=false to skip this —
      # e.g. during Phase-8 UAT, when real testers' in-progress state on staging
      # should survive a deploy. Unset (the default) means "seed on every deploy".
      # Needs the deployer SA's roles/datastore.user (Firestore) + storage.admin
      # (the image bucket) — see infra/setup-wif.sh.
      - name: Re-seed staging (data + images)
        if: vars.STAGING_AUTOSEED != 'false'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          IMAGE_BUCKET: ${{ env.IMAGE_BUCKET }}
          # Opt-in realistic UAT faces (OFC-249). Unset, or unreadable, and the
          # image seeder falls back to the eight committed placeholders with a
          # warning — a missing fixture set must never fail a deploy.
          UAT_FIXTURES_BUCKET: ${{ env.UAT_FIXTURES_BUCKET }}
        run: |
          npm run seed:staging --workspace tools/fake-data
          npm run seed:staging-images --workspace tools/fake-data

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      # Reconcile the image bucket's IAM + versioning + lifecycle on every deploy so
      # the live bucket can't drift from infra/provision-staging.sh. The deploy path
      # only ran `gcloud run deploy`, so a provisioning change that lived solely in
      # the script (the 4c-1 runtime-SA upgrade objectViewer→objectAdmin, and the D94
      # versioning + 90-day noncurrent lifecycle) never reached staging — the runtime
      # SA couldn't WRITE headshots and every upload 500'd. Idempotent; needs the
      # deployer's storage.admin (already granted, infra/setup-wif.sh). A prod deploy
      # workflow should carry the same step.
      - name: Reconcile image bucket (IAM + versioning + lifecycle, D94/N42)
        run: |
          gcloud storage buckets add-iam-policy-binding "gs://$IMAGE_BUCKET" \
            --member="serviceAccount:$RUNTIME_SA" --role="roles/storage.objectAdmin" --quiet
          gcloud storage buckets update "gs://$IMAGE_BUCKET" --versioning
          printf '%s' '{ "rule": [ { "action": { "type": "Delete" }, "condition": { "daysSinceNoncurrentTime": 90 } } ] }' > /tmp/img-lifecycle.json
          gcloud storage buckets update "gs://$IMAGE_BUCKET" --lifecycle-file=/tmp/img-lifecycle.json

      # The same reconciliation for the BACKUP bucket (7b-2, D147/D101), for the
      # same reason and by the same precedent: its IAM and lifecycle also live only
      # in infra/provision-staging.sh, so without this a future change to either
      # would sit in the script and never reach the live bucket — exactly the 4c-1
      # drift above, whose symptom here would be far quieter than 500ing uploads
      # (backups would keep succeeding while silently over-retaining PII, or the
      # runtime SA would lose write access and the job would start failing).
      #
      # ⚠ objectCreator + objectViewer, never objectAdmin: Book must be unable to
      # DELETE or OVERWRITE a snapshot, so a compromised API cannot destroy backup
      # history (D101 "backup-as-crown-jewels"). If this line ever grows to
      # objectAdmin to "fix" something, that property is gone.
      #
      # Guarded on the bucket existing: a deploy must not fail merely because a
      # freshly-cloned environment has not been provisioned yet.
      - name: Reconcile backup bucket (IAM + lifecycle, D147/D101)
        run: |
          if ! gcloud storage buckets describe "gs://$BACKUP_BUCKET" >/dev/null 2>&1; then
            echo "gs://$BACKUP_BUCKET does not exist yet — run infra/provision-staging.sh. Skipping."
            exit 0
          fi
          gcloud storage buckets add-iam-policy-binding "gs://$BACKUP_BUCKET" \
            --member="serviceAccount:$RUNTIME_SA" --role="roles/storage.objectCreator" --quiet
          gcloud storage buckets add-iam-policy-binding "gs://$BACKUP_BUCKET" \
            --member="serviceAccount:$RUNTIME_SA" --role="roles/storage.objectViewer" --quiet
          printf '%s' '{ "rule": [ { "action": { "type": "Delete" }, "condition": { "age": 90 } } ] }' > /tmp/backup-lifecycle.json
          gcloud storage buckets update "gs://$BACKUP_BUCKET" --lifecycle-file=/tmp/backup-lifecycle.json

      # Mirror the freshly-seeded fake profiles into ghost-staging as real Ghost
      # members, so the Book→Ghost write path (5b-1) can be tested end-to-end (D72,
      # ghost-staging only). A delta reconcile scoped to **@example.test emails** —
      # safe, and re-running it is the reset. (It was `book-seed`-label-scoped once;
      # that was dropped because a label scope could not see members the real write
      # path created, orphaning them on every reset.) Runs AFTER the re-seed, which
      # it needs for the seeded profiles, and BEFORE the API deploy so the new
      # revision cold-starts with the real ids hydrated.
      #
      # Its scope and the UAT-tester step's below are disjoint by construction: this
      # owns @example.test addresses, that one owns `book-uat-tester`-labelled
      # members with real addresses. Neither can see the other's.
      #
      # OPT-IN: only when the repo var STAGING_GHOST_MIRROR=true (and autoseed is on).
      # Off by default so normal deploys neither hit ghost-staging nor depend on it.
      # The Admin key is pulled from Secret Manager at run time (the deployer SA has
      # secretAccessor); it is never written to the workflow or logged.
      - name: Mirror fake profiles into ghost-staging (5b-1 write-path UAT)
        if: vars.STAGING_AUTOSEED != 'false' && vars.STAGING_GHOST_MIRROR == 'true'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          GHOST_ADMIN_API_URL: ${{ env.GHOST_ADMIN_API_URL }}
          GHOST_NEWSLETTER_ID: ${{ env.GHOST_NEWSLETTER_ID }}
        run: |
          GHOST_ADMIN_API_KEY="$(gcloud secrets versions access latest --secret=ghost-admin-api-key --project="$PROJECT_ID")" \
            npm run mirror:ghost-staging --workspace tools/fake-data

      # Provision the UAT tester cohort (OFC-248/D156) — real-named Book profiles at
      # TESTER_ID_FLOOR (#9001+) plus their matching ghost-staging members, so each
      # tester signs in through the real bridge under their own name.
      #
      # PLACED HERE, not in the reseed block above, for one mechanical reason: it
      # needs `gcloud secrets` for the Ghost Admin key, and `Set up gcloud` runs
      # after the reseed. It must still land BEFORE the Cloud Run deploy so the new
      # revision cold-starts with the testers' emails in the index — the API builds
      # that index only at hydration.
      #
      # Ordering against the fake-data mirror above is not delicate: the two scopes
      # are disjoint by construction. The mirror owns `@example.test` members; this
      # owns members labelled `book-uat-tester`. Neither can see the other's.
      #
      # Gated on the roster URI, and skipped along with the rest of the reseed when
      # STAGING_AUTOSEED=false — during UAT the cohort's own edits must survive a
      # deploy, and re-running this would replace their profiles with blank ones.
      #
      # ⚠ The roster holds REAL names and email addresses. The tool prints ids and
      # counts only; these logs are world-readable on a public repo.
      - name: Provision UAT testers (Book profiles + ghost-staging members)
        if: vars.STAGING_AUTOSEED != 'false' && env.UAT_ROSTER_URI != ''
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.PROJECT_ID }}
          UAT_ROSTER_URI: ${{ env.UAT_ROSTER_URI }}
          GHOST_ADMIN_API_URL: ${{ env.GHOST_ADMIN_API_URL }}
          GHOST_NEWSLETTER_ID: ${{ env.GHOST_NEWSLETTER_ID }}
        run: |
          GHOST_ADMIN_API_KEY="$(gcloud secrets versions access latest --secret=ghost-admin-api-key --project="$PROJECT_ID")" \
            npm run seed:staging-testers --workspace tools/fake-data

      # API last: gcloud only needs the token briefly to SUBMIT the Cloud Build
      # (the build then runs server-side as the build SA), so it tolerates the
      # slightly older token. Same flags as the provisioning playbook (D83
      # scale-to-zero, D126 image bucket, fake-data staging --allow-unauthenticated).
      #
      # The Ghost auth-bridge config (Phase 1b) rides here because --set-env-vars
      # REPLACES the whole env set on each deploy; GHOST_BRIDGE_TARGET=staging
      # makes the live relay route staging sign-ins to the staging callback (D72).
      #
      # Because it REPLACES rather than merges, every variable the app needs must
      # be on this one line — an omission silently un-configures a feature on the
      # next deploy rather than failing. The BACKUP_* trio (7b-2) is the newest
      # instance: drop it and the nightly backup starts 503-ing, with no other
      # symptom until the staleness alert fires a day later.
      - name: Deploy API to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --max-instances 1 --min-instances 0 \
            --memory 1Gi \
            --set-env-vars "IMAGE_BUCKET=$IMAGE_BUCKET,GHOST_JWKS_URL=$GHOST_JWKS_URL,GHOST_JWT_ISSUER=$GHOST_JWT_ISSUER,GHOST_JWT_AUDIENCE=$GHOST_JWT_AUDIENCE,GHOST_BRIDGE_URL=$GHOST_BRIDGE_URL,GHOST_BRIDGE_TARGET=$GHOST_BRIDGE_TARGET,GHOST_ADMIN_API_URL=$GHOST_ADMIN_API_URL,GHOST_NEWSLETTER_ID=$GHOST_NEWSLETTER_ID,BACKUP_BUCKET=$BACKUP_BUCKET,BACKUP_AUDIENCE=$BACKUP_AUDIENCE,BACKUP_INVOKER_SUBJECT=$BACKUP_INVOKER_SUBJECT,BOOK_API_VERSION=$BOOK_VERSION" \
            --set-secrets "GHOST_ADMIN_API_KEY=ghost-admin-api-key:latest" \
            --allow-unauthenticated \
            --quiet
